name: Build signed O-Beat release
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Install the Android toolchain
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # yes exits with SIGPIPE when sdkmanager finishes; keep the latter's exit status.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Resolve pinned ffMetadataEx and FFmpeg
        run: |
          # ffMetadataEx is ignored locally and has no Git submodule entry in the tree.
          git clone --filter=blob:none --no-checkout https://github.com/OuterTune/ffMetadataEx ffMetadataEx
          git -C ffMetadataEx checkout --detach 5374cd8b5eaf603c09ea8199aaf11311a3e60254
          git clone --filter=blob:none --no-checkout https://github.com/mikooomich/ffmpeg-android-maker-prebuilt ffMetadataEx/ffmpeg-android-maker
          git -C ffMetadataEx/ffmpeg-android-maker checkout --detach 720abaf0f5707b5e9a4a78a2167ccc70ce8a0807

      - name: Setup signing configs
        run: |
          test -n "$KEYSTORE" && test -n "$KEYSTORE_PROPERTIES"
          printf '%s' "$KEYSTORE" | base64 --decode > test.jks
          printf '%s' "$KEYSTORE_PROPERTIES" > keystore.properties
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}

      - name: Read release version
        id: version
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*versionName = "([0-9]+(\.[0-9]+)+)".*/\1/p' app/build.gradle.kts)
          test -n "$VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run release logic tests
        run: bash gradlew :app:testCoreDebugUnitTest :innertube:test --console=plain

      - name: Build signed APKs
        run: bash gradlew :app:assembleCoreRelease :app:assembleFullRelease --console=plain

      - name: Keep build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: O-Beat-${{ steps.version.outputs.name }}
          path: app/build/outputs/apk/*/release/*.apk

      - name: Create github release draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: O-Beat ${{ steps.version.outputs.name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/core/release/*.apk
            app/build/outputs/apk/full/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
