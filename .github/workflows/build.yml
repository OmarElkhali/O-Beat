name: Build debug APK
on:
  workflow_dispatch:
  push:
    branches:
      - canary
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Install the Android toolchain
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Resolve pinned ffMetadataEx and FFmpeg
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/OuterTune/ffMetadataEx ffMetadataEx
          git -C ffMetadataEx checkout --detach 5374cd8b5eaf603c09ea8199aaf11311a3e60254
          git clone --filter=blob:none --no-checkout https://github.com/mikooomich/ffmpeg-android-maker-prebuilt ffMetadataEx/ffmpeg-android-maker
          git -C ffMetadataEx/ffmpeg-android-maker checkout --detach 720abaf0f5707b5e9a4a78a2167ccc70ce8a0807

      - name: Build debug APK and run jvm tests
        run: bash gradlew :app:assembleCoreDebug :app:lintCoreDebug :app:testCoreDebugUnitTest :innertube:test --stacktrace --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: app/build/outputs/apk/core/debug/*.apk
